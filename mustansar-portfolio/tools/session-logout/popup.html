<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Session Logout</h1>
    <p class="sub">Clears cookies &amp; storage for the sites you list. Logout only.</p>
  </header>

  <section class="add-row">
    <input id="domainInput" type="text" placeholder="e.g. chatgpt.com" autocomplete="off" />
    <button id="addBtn" class="secondary">Add</button>
  </section>

  <ul id="siteList"></ul>
  <p id="emptyHint" class="hint">No sites yet. Add one above.</p>

  <section class="actions">
    <button id="logoutAllBtn" class="primary">Log out of everything</button>
  </section>

  <p id="status" class="status"></p>

  <script src="popup.js"></script>
</body>
</html>
